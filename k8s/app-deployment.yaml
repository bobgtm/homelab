apiVersion: apps/v1
kind: Deployment
metadata:
  name: barrelbook-app
  namespace: barrelbook
  labels:
    app: barrelbook
    component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: barrelbook
      component: web 
  template:
    metadata:
      labels:
        app: barrelbook
        component: web
    spec:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: docker.io/library/barrelbook:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_HOST
              value: db          
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: barrelbook-db
                  key: DB_NAME  
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: barrelbook-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: barrelbook-db
                  key: DB_PASSWORD
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/bourbon/images/uploads
      volumes: 
        - name: uploads
          persistentVolumeClaim: 
            claimName: barrelbook-uploads